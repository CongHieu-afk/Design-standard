# Mẫu cho kho sử dụng Design-standard.
# Thay <PINNED_COMMIT_SHA> bằng commit đã duyệt; không dùng main/latest.
name: design-standard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-ui:
    # Đồng bộ với Playwright 1.59.1; tránh ubuntu-latest trôi sang Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout trusted standard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CongHieu-afk/Design-standard
          ref: <PINNED_COMMIT_SHA>
          path: .design-standard
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      - name: Install verifier dependencies
        working-directory: .design-standard
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          node -e "const {spawn}=require('node:child_process');const c=require('./design.config.json').preview.command;const p=spawn(c,{shell:true,detached:true,stdio:'ignore'});p.unref()"
      - name: Mandatory verification
        run: >-
          node .design-standard/design_standard/scripts/verify-project.mjs
          --config design.config.json
          --changed-from ${{ github.event.pull_request.base.sha || github.event.before }}
          --run
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-standard-audit
          path: audit_out/verify
          if-no-files-found: ignore
